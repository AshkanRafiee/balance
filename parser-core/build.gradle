// Python's standard JSON codec rejects duplicate keys and invalid syntax before
// Groovy decodes the canonical result. Both frontends use the Java semantic mapper.
// Only synthetic repository fixtures pass through this development-only task.
tasks.register('ruleExampleTest') {
    dependsOn classes
    doLast {
        def repository = projectDir.parentFile
        def input = providers.exec {
            commandLine 'python3', '-B', new File(repository, 'tools/read_rule_examples.py'),
                new File(repository, 'rules/examples')
        }
        def documents = new groovy.json.JsonSlurper().parseText(input.standardOutput.asText.get())
        def urls = sourceSets.main.output.classesDirs.files.collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, (ClassLoader) null)
        try {
            def packClass = loader.loadClass('com.ashkanrafiee.balance.parser.PackDocument')
            def parserClass = loader.loadClass('com.ashkanrafiee.balance.parser.Parser')
            def messageClass = loader.loadClass('com.ashkanrafiee.balance.parser.Parser$Message')
            int cases = 0
            documents.each { document ->
                def pack = packClass.getMethod('decode', Map).invoke(null, document.pack)
                def parser = parserClass.getConstructor(List).newInstance(pack.templates())
                if (document.fixtures.schema != 'prototype-fixtures-1' || document.fixtures.pack != pack.id()) {
                    throw new GradleException('Invalid fixture metadata')
                }
                document.fixtures.cases.each { fixture ->
                    def message = messageClass.getConstructor(String, String, String,
                        java.time.Instant, java.time.ZoneId).newInstance(
                            fixture.sourceId, fixture.sender, fixture.body,
                            java.time.Instant.parse(fixture.arrival), java.time.ZoneId.of(fixture.zone))
                    def result = parserClass.getMethod('parse', messageClass).invoke(parser, message)
                    if (result.status().name() != fixture.expected.status) {
                        throw new GradleException("Invalid example ${pack.id()}/${fixture.id}: " +
                            "expected status ${fixture.expected.status}, got ${result.status().name()}")
                    }
                    if (fixture.expected.status != 'PARSED' && !result.matchedProvenance().isEmpty()) {
                        throw new GradleException("Invalid example ${pack.id()}/${fixture.id}: " +
                            'rejected example retained provenance')
                    }
                    def actual = result.facts().collect { fact ->
                        def expected = fixture.expected.outputs.find { it.id == fact.provenance().outputId() }
                        def projection = [id: fact.provenance().outputId(), account: fact.account(),
                         currency: fact.money().currency().name(), minorUnits: Long.toString(fact.money().minorUnits()),
                         scale: fact.money().scale()]
                        if (expected?.containsKey('time')) {
                            projection.time = [instant: fact.time().instant().toString(),
                                precision: fact.time().precision().name(), zone: fact.time().zone().getId(),
                                fallback: fact.time().fallback()]
                        }
                        ['reason', 'channel'].each { field ->
                            if (expected?.containsKey(field)) {
                                def text = field == 'reason' ? fact.reason() : fact.channel()
                                projection[field] = text == null ? null : [id: text.id(), text: text.text()]
                            }
                        }
                        projection
                    }.sort { it.id }
                    if (actual != fixture.expected.outputs.sort { it.id }) {
                        def problems = result.diagnostics().collect {
                            [template: it.templateKey(), output: it.outputId(), field: it.field(),
                             code: it.code().name()]
                        }
                        throw new GradleException("Invalid example ${pack.id()}/${fixture.id}: " +
                            'output mismatch, expected=' + (fixture.expected.outputs.sort { it.id }) +
                            ' actual=' + actual + ' diagnostics=' + problems)
                    }
                    cases++
                }
            }
            logger.lifecycle("Rule examples: ${cases} cases passed")
        } finally {
            loader.close()
        }
    }
}

