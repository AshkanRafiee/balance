// Compile the unchanged arithmetic oracle in isolation, never into the core artifact.
def calendarOracle = tasks.register('compileLegacyCalendarOracle', JavaCompile) {
    source new File(projectDir.parentFile,
        'app/src/main/java/com/ashkanrafiee/balance/JalaliCalendar.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('legacy-calendar-oracle')
    options.release = 17
}

