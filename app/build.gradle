plugins { id 'com.android.application' }

android { namespace 'com.ashkanrafiee.balance'; compileSdk 35
    defaultConfig { applicationId 'com.ashkanrafiee.balance'; minSdk 26; targetSdk 35; versionCode 10500; versionName '1.5.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    dependenciesInfo { includeInApk = false; includeInBundle = false }
    def signingFile = rootProject.file('signing.properties')
    def signingValues = new Properties()
    if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
    signingConfigs { release {
        if (signingValues['storeFile']) {
            storeFile rootProject.file(signingValues['storeFile'])
            if (signingValues['storeType']) storeType signingValues['storeType']
            storePassword signingValues['storePassword']
            keyAlias signingValues['keyAlias']
            keyPassword signingValues['keyPassword']
            enableV3Signing true
        }
    } }
    buildTypes {
        release {
            if (signingValues['storeFile']) signingConfig signingConfigs.release
            minifyEnabled false
            // Drop source.properties/META-INF version-control info so the tagged build is byte-for-byte
            // reproducible by F-Droid and third parties (AGP 8.3+ bundles VCS info by default).
            vcsInfo { include false }
        }
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
